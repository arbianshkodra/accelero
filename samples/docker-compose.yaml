services:
  web:
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.entrypoints: "web"
      traefik.http.routers.web.rule: "PathPrefix(`/`)"
    image: nginx:1.27.0
    # image: nginx:1.26.1
    restart: always
    networks:
      - traefik

  traefik:
    image: traefik:v2.5
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entryPoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080" # Traefik Dashboard
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
    networks:
      - traefik

networks: # Optional
  traefik:
    driver: bridge
