# Sample GitOps repo compose file.
#
# This file (together with the .env next to it) represents what a user's
# GitOps repo looks like — *not* Accelero's own configuration.  Accelero
# will substitute ${VAR} references from the .env next to this file before
# parsing, exactly like docker-compose.
#
# See docs/usage-overview.md#variable-interpolation-env-file for the full
# syntax (defaults, required vars, escapes).

services:
  web:
    image: ${NGINX_TAG:-nginx:1.27.1}
    restart: always
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 10s
      retries: 3

  proxy:
    image: caddy:${CADDY_TAG:?CADDY_TAG is required}
    command: ["caddy", "reverse-proxy", "--from", ":80", "--to", "web:${WEB_PORT:-80}"]
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      - web
    networks:
      - app

networks:
  app:
    driver: bridge
