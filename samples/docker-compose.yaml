services:
  web:
    image: nginx:1.27.1
    restart: always
    networks:
      - app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost"]
      interval: 10s
      timeout: 10s
      retries: 3

  proxy:
    image: caddy:2-alpine
    command: ["caddy", "reverse-proxy", "--from", ":80", "--to", "web:80"]
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - app

networks:
  app:
    driver: bridge
