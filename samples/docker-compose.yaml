# Sample GitOps repo compose file.
#
# This file (together with the .env next to it) represents what a user's
# GitOps repo looks like — *not* Accelero's own configuration.  Accelero
# will substitute ${VAR} references from the .env next to this file before
# parsing, exactly like docker-compose.
#
# It intentionally exercises the whole zero-downtime story in one file:
#   * `web` runs N replicas behind Caddy with only `expose:` (no host port)
#   * `proxy` is the only thing binding the host port — it never rolls
#   * on an image bump of `web`, Accelero replaces one replica at a time
#     while Caddy keeps serving from whichever are healthy
#
# See docs/usage-overview.md#replicas for the full pattern, and the
# README.md next to this file for a scripted zero-downtime proof.

services:
  web:
    image: ${NGINX_TAG:-nginx:1.27.1-alpine}
    restart: always
    networks:
      - app
    # wget is present on alpine nginx images; curl is NOT (neither on
    # the debian-based ones).  --spider makes wget not save output.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 2s
    deploy:
      replicas: ${WEB_REPLICAS:-3}

  proxy:
    image: caddy:${CADDY_TAG:?CADDY_TAG is required}
    # Caddyfile is committed to this gitops repo alongside the compose
    # file and bind-mounted into the container.  Accelero resolves
    # `./Caddyfile` against the stack's cloned repo dir; see
    # docs/usage-overview.md#bind-mounts-from-the-gitops-repo.
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    ports:
      - "${PUBLIC_PORT:-80}:80"
    depends_on:
      - web
    networks:
      - app

networks:
  app:
    driver: bridge
