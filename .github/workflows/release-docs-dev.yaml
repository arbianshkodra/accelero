name: Release Docs Dev

on:
  workflow_run:
    workflows: ["Release Dev"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release-docs-dev:
    name: Release Docs Dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate documentation
        run: mkdocs build

      - name: Install SSH Key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          CERT_PATH: ${{ secrets.CERT_PATH }}
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Deploy documentation
        env:
          CERT_PATH: ${{ secrets.CERT_PATH }}
          DEPLOY_HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_PATH: ${{ secrets.PATH }}
        run: scp -i "$CERT_PATH" -r site/ "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
