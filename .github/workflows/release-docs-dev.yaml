name: Release Docs Dev

on:
  workflow_run:
    workflows: ["Release Dev"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release-docs-dev:
    name: Release Docs Dev
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate documentation
        run: mkdocs build

      - name: Install SSH Key
        shell: bash
        run: |
          export PATH=$PATH:/bin:/usr/bin
          CERT_PATH="${{ secrets.CERT_PATH }}"
          CERT_PATH="${CERT_PATH/#\~/$HOME}"
          mkdir -p "$(dirname "$CERT_PATH")"
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > "$CERT_PATH"
          chmod 600 "$CERT_PATH"
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Copy Files via SCP
        shell: bash
        run: |
          CERT_PATH="${{ secrets.CERT_PATH }}"
          CERT_PATH="${CERT_PATH/#\~/$HOME}"
          /usr/bin/scp -i "$CERT_PATH" -r site/ ${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.PATH }}
