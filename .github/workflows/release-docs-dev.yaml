name: Release Docs Dev

on:
  workflow_dispatch:
  pull_request_target:
    branches: [dev]

permissions:
  contents: write

jobs:
  release-docs-dev:
    name: Release Docs Dev
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate documentation
        run: mkdocs build

      - name: Install SSH Key
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KEY_PATH: ${{ secrets.CERT_PATH }}
          HOST: ${{ secrets.HOST }}
        run: |
          /bin/mkdir -p ~/.ssh
          /usr/bin/printf '%s\n' "$SSH_KEY" > "$KEY_PATH"
          /bin/chmod 600 "$KEY_PATH"
          /usr/bin/ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy documentation
        shell: bash
        env:
          KEY_PATH: ${{ secrets.CERT_PATH }}
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_PATH: ${{ secrets.PATH }}
        run: /usr/bin/scp -i "$KEY_PATH" -r site/ "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}"
