name: Release Docs Dev

on:
  workflow_run:
    workflows: ["Release Dev"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release-docs-dev:
    name: Release Docs Dev
    runs-on: ubuntu-latest
    # Only run if the Release Dev workflow succeeded
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "mkdocs>=1.6,<2" "mkdocs-material>=9,<10"

      - name: Generate documentation
        run: mkdocs build

      - name: Install SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ${{ secrets.CERT_PATH }}
          chmod 600 ${{ secrets.CERT_PATH }}
          ssh-keyscan -H ${{ secrets.HOST }} >> ~/.ssh/known_hosts

      - name: Deploy documentation
        run: /usr/bin/scp -i ${{ secrets.CERT_PATH }} -r site/ ${{ secrets.USER }}@${{ secrets.HOST }}:${{ secrets.PATH }}
