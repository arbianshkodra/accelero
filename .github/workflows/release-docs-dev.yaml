name: Release Docs Dev

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/release-docs-dev.yaml'
  workflow_run:
    workflows: ["Release Dev"]
    types:
      - completed

permissions:
  contents: write

jobs:
  release-docs-dev:
    name: Release Docs Dev
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate documentation
        run: mkdocs build

      - name: Install SSH Key
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          KEY_PATH: ${{ secrets.CERT_PATH }}
          HOST: ${{ secrets.HOST }}
        run: |
          /bin/mkdir -p ~/.ssh
          /usr/bin/printf '%s\n' "$SSH_KEY" > "$KEY_PATH"
          /bin/chmod 600 "$KEY_PATH"
          /usr/bin/ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

      - name: Deploy documentation
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          KEY_PATH: ${{ secrets.CERT_PATH }}
          HOST: ${{ secrets.HOST }}
          DEPLOY_USER: ${{ secrets.USER }}
          DEPLOY_PATH: ${{ secrets.PATH }}
        run: /usr/bin/scp -i "$KEY_PATH" -r site/ "${DEPLOY_USER}@${HOST}:${DEPLOY_PATH}"
