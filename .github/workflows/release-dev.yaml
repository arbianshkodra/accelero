name: Release Dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '**/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22.x
      - uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "latest"
          install-go: "false"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      CGO_ENABLED: 0
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22.x
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build
        uses: goreleaser/goreleaser-action@v6.0.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Manifest
        run: |
          export TAG=$(git describe --tags --exact-match HEAD | sed 's/^v*//')
          docker manifest create arbianshkodra/accelero:$TAG \
            arbianshkodra/accelero:amd64-${TAG} \
            arbianshkodra/accelero:386-${TAG} \
            arbianshkodra/accelero:arm64-${TAG} \
            arbianshkodra/accelero:arm-${TAG}
