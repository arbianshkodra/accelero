name: Release Dev

on:
  push:
    branches:
      - workflow-setup

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
              fetch-depth: 0
          - name: Set up Go
            uses: actions/setup-go@v4
            with:
              go-version: 1.22.x
          - uses: dominikh/staticcheck-action@v1.3.1
            with:
              version: "latest"
              install-go: "false"