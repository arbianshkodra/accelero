name: Release Dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '**/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x

      - name: Build Binaries
        run: ./scripts/build_binaries.sh

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker Images
        run: ./scripts/build_docker_images.sh

      # Keep the Docker Hub repository overview in sync with the tailored
      # .docker/README.md (absolute links so nothing renders broken).
      # non-fatal: Docker Hub historically requires an account PASSWORD (not a
      # PAT) to update the description. If DOCKER_HUB_ACCESS_TOKEN is a PAT and
      # this 401s, add a DOCKER_HUB_PASSWORD secret and point `password` at it —
      # the release itself still succeeds regardless.
      - name: Sync overview to Docker Hub
        continue-on-error: true
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
          repository: arbianshkodra/accelero
          short-description: ${{ github.event.repository.description }}
          readme-filepath: ./.docker/README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
          token: ${{ secrets.GH_TOKEN }}
