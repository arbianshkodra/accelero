name: Release Dev

on:
  push:
    branches:
      - workflow-setup
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '**/v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22.x
      - uses: dominikh/staticcheck-action@v1.3.1
        with:
          version: "latest"
          install-go: "false"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      CGO_ENABLED: 0
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.22.x
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build
        uses: goreleaser/goreleaser-action@v6.0.0
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Manifest
        run: |
          TAG=$(git describe --tags --first-parent --abbrev=7 --long --dirty --always | sed -e "s/^v//g")
          docker manifest create arbianshkodra/accelero:$TAG \
            arbianshkodra/accelero:amd64-${TAG} \
            arbianshkodra/accelero:386-${TAG} \
            arbianshkodra/accelero:arm64-${TAG} \
            arbianshkodra/accelero:arm-${TAG}
          docker manifest annotate arbianshkodra/accelero:$TAG arbianshkodra/accelero:amd64-${TAG} --os linux --arch amd64
          docker manifest annotate arbianshkodra/accelero:$TAG arbianshkodra/accelero:386-${TAG} --os linux --arch 386
          docker manifest annotate arbianshkodra/accelero:$TAG arbianshkodra/accelero:arm64-${TAG} --os linux --arch arm64
          docker manifest annotate arbianshkodra/accelero:$TAG arbianshkodra/accelero:arm-${TAG} --os linux --arch arm
      - name: Docker Push
        run: |
          TAG=$(git describe --tags --first-parent --abbrev=7 --long --dirty --always | sed -e "s/^v//g")
          docker push arbianshkodra/accelero:$TAG
          docker push arbianshkodra/accelero:amd64-${TAG}
          docker push arbianshkodra/accelero:386-${TAG}
          docker push arbianshkodra/accelero:arm64-${TAG}
          docker push arbianshkodra/accelero:arm-${TAG}
      - name: Push Manifest for Latest
        run: |
          docker manifest push arbianshkodra/accelero:latest
