name: Release Dev

on:
  push:
    branches:
      - workflow-setup

permissions:
  contents: write

jobs:
	lint:
		name: Lint
		runs-on: ubuntu-latest
		steps:
		- name: Checkout
			uses: actions/checkout@v4
			with:
				fetch-depth: 0
		- name: Set up Go
			uses: actions/setup-go@v4
			with:
				go-version: 1.22.x
		- uses: dominikh/staticcheck-action@v1.3.1
			with:
				version: "latest"
				install-go: "false"

	build:
		name: Build
		runs-on: ubuntu-latest
		needs: lint
    env:
      CGO_ENABLED: 0
      TAG: ${{ github.ref_name }}
		steps:
		- name: Checkout
			uses: actions/checkout@v4
			with:
				fetch-depth: 0
		- name: Set up Go
			uses: actions/setup-go@v4
			with:
				go-version: 1.22.x
		- name: Docker Login
			uses: docker/login-action@v3.3.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
		- name: Build
			uses: goreleaser/goreleaser-action@v6.0.0
			with:
				version: '~> v2'
				args: release --clean
			env:
				GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
