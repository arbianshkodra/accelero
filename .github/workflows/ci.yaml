name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.25.x

      # Run staticcheck directly rather than via dominikh/staticcheck-action,
      # whose latest release (v1.4.1) still bundles a Node.js-20 actions/cache
      # and triggers the runner deprecation warning. `go run` uses the Go
      # toolchain already set up above — no third-party action, no Node dep.
      - name: Static check
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

  test:
    name: Test
    strategy:
      matrix:
        go-version: [1.25.x]
        platform: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test ./... -coverprofile coverage.out
